# Example standalone download run - copy this file and adjust the date
# range/variables for a one-off bulk download outside of any site-extraction
# config. Run with:
#   download-prs --config config/download_hrrr_prs_example.yaml

configure_file: /global/cfs/projectdirs/m1657/liuy351/DATA/HRRR/download_fastheribie/scripts/config/default_download_prs.yaml

start_date: "2025-12-01"
end_date: "2025-12-31"
