# Test: extract a lat/lon bounding-box region (Texas/Oklahoma panhandle,
# covering the Wake Wind/Kay Wind/Grant Wind/Salt Fork/Bethel/Cactus Flats
# cluster of AL_ST sites) instead of single-site pixels.

product: nat
fxx: 0

region:
  min_lat: 30.0
  max_lat: 38.0
  min_lon: -103.0
  max_lon: -96.0

grib_dir: /global/cfs/projectdirs/m1657/liuy351/DATA/HRRR/download_fastheribie/grib2_natf00
output_dir: /global/cfs/projectdirs/m1657/liuy351/DATA/HRRR/download_fastheribie/sites/southern_co_region

processing:
  start_date: "20250201"
  end_date: "20250228"

download:
  configure_file: /global/cfs/projectdirs/m1657/liuy351/DATA/HRRR/download_fastheribie/scripts/config/default_download_nat.yaml
  workers: 8
  retries: 3
  retry_wait: 5.0
  overwrite: false
  local_archive_dir: /global/cfs/projectdirs/m1657/liuy351/DATA/HRRR/grib2/native

# nat's native vertical coordinate is "hybrid" model levels, not pressure
# (isobaricInhPa) - that's prs's coordinate. u_hybrid/v_hybrid here pack
# all 50 hybrid levels into one variable with an extra "hybrid" dimension.
variables:
  heightAboveGround:
    enabled: true
    vars:
      t2m: t2m
      u: u80
      v: v80
  hybrid:
    enabled: true
    vars:
      u: u_hybrid
      v: v_hybrid

options:
  skip_existing: true
  compression: false
  concatenate: true
  keep_hourly: true
